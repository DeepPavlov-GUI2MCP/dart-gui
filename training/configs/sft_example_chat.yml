train_sft:
  model:
    base_model: ByteDance-Seed/UI-TARS-1.5-7B
    max_seq_length: 2048
    trust_remote_code: true

  dataset:
    format: chat
    repo_id: mlabonne/FineTome-100k
    split: train[:8]
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value

  hf:
    api_key: ${HUGGINGFACE_API_KEY}

  hub:
    push_to_hub: false

  output:
    output_dir: outputs/sft/ui-tars-chat-smoke
    datasets_dir: datasets/runtime

  training:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 2
    max_steps: 5
    learning_rate: 0.0002
    warmup_steps: 1
    logging_steps: 1
    save_steps: 5
    packing: true
    gradient_checkpointing: true
    bf16: true
    fp16: false

  lora:
    r: 16
    alpha: 32
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - down_proj
      - up_proj
