train_sft:
  model:
    base_model: ByteDance-Seed/UI-TARS-1.5-7B
    max_seq_length: 2048
    trust_remote_code: true

  dataset:
    format: uitars_trace
    trace_roots:
      - GUI-Docker-Env/results/results_uitars15_writer_full_20260530_143529/pyautogui/screenshot/ui_tars_1.5
    task_examples_dir: GUI-Docker-Env/evaluation_examples/examples
    sample_mode: per_step
    history_n: 5
    min_result: 1.0
    uitars:
      prompt_style: qwen25vl_normal
      infer_mode: qwen25vl_normal
      language: English
      max_pixels: 12845056
      min_pixels: 78400

  hf:
    api_key: ${HUGGINGFACE_API_KEY}

  hub:
    push_to_hub: true
    model_id: your-hf-username/ui-tars-sft-example
    private: true

  output:
    output_dir: outputs/sft/ui-tars-example
    datasets_dir: datasets/runtime

  training:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 2
    max_steps: 5
    learning_rate: 0.0002
    warmup_steps: 1
    logging_steps: 1
    save_steps: 5
    packing: false
    gradient_checkpointing: true
    bf16: true
    fp16: false

  lora:
    r: 16
    alpha: 32
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - down_proj
      - up_proj
