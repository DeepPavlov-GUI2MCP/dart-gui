train_sft:
  model:
    base_model: ByteDance-Seed/UI-TARS-1.5-7B
    max_seq_length: 2048
    trust_remote_code: true

  dataset:
    format: uitars_trace
    trace_source: holo
    trace_roots:
      - GUI-Docker-Env/results/results_holo_gpt54_writer_traces_20260607_031517/pyautogui/screenshot/Hcompany/Holotron-3-Nano
    task_examples_dir: GUI-Docker-Env/evaluation_examples/examples
    sample_mode: per_step
    history_n: 5
    max_rollouts: 16
    refresh: true
    goal_variants: true
    max_goal_variants: 1
    pretokenized_traces_dir: datasets/runtime/pretokenized-smoke-16
    task_generation_root: ../gui_distillation/data/synthetic/libreoffice_writer/active_root_231/task_generation/gpt-5.4
    uitars:
      prompt_style: qwen25vl_normal
      infer_mode: qwen25vl_normal
      language: English
      max_pixels: 12845056
      min_pixels: 78400

  hf:
    api_key: ${HF_TOKEN}

  hub:
    push_to_hub: false

  output:
    output_dir: outputs/sft/ui-tars-holo-goal-variants-smoke-16
    datasets_dir: datasets/runtime

  training:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    num_train_epochs: 1
    learning_rate: 0.0002
    warmup_steps: 1
    logging_steps: 10
    save_steps: 100
    packing: false
    gradient_checkpointing: true
    fp16: true
    ddp_find_unused_parameters: true

  lora:
    r: 16
    alpha: 32
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - down_proj
      - up_proj
